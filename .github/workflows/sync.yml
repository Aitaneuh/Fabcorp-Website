name: Fabcorp Website Forgejo Sync
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from Forgejo
        run: |
          # Configure Git Identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add Forgejo Remote (Using a secret for auth if private)
          # If public, you can keep the original URL
          git remote add forgejo https://git.fabcorp.ch/Fabcorp/Fabcorp-Website.git

          # Fetch and Merge
          git fetch forgejo
          
          # Use --strategy-option theirs if you want Forgejo to always overwrite conflicts
          git merge forgejo/main --allow-unrelated-histories -m "Sync from Forgejo"

          # Push changes back to GitHub
          git push origin main
